# Codegen policy for equity.
#
# `user_owned` globs are hand-written files that live inside generator-owned trees but are
# NOT schema-derived. `metaphor schema generate [--force]` skips them wholesale (never reads,
# merges, or deletes them). Everything else in src/ is regenerated from schema/models.
#
# Re-exports/declarations that must sit alongside generated code live inside
# `// <<< CUSTOM ... // END CUSTOM` markers (service/mod.rs, presentation/http/mod.rs, lib.rs)
# and are preserved by the marker mechanism, not listed here.
#
# Add your hand-authored services, handlers, tests, and docs below as you write them.

user_owned:
  # Hand-authored equity behavior (cap-table + GL) + its ports/events.
  - "src/application/service/equity_gl.rs"
  - "src/application/service/equity_events.rs"
  - "src/application/service/equity_write_service.rs"
  # The write surface, chunked out of equity_write_service.rs. Each is an `impl EquityWriteService`
  # block; the shared vocabulary (input structs, outcomes, errors) stays in equity_write_service.rs.
  - "src/application/service/equity_register.rs"
  - "src/application/service/equity_issue.rs"
  - "src/application/service/equity_transfer.rs"
  - "src/application/service/equity_buyback.rs"
  - "src/application/service/equity_dividend.rs"
  - "src/application/service/equity_read.rs"
  # Own the hand-written equity SQL (the register's movement inserts + position lock + both
  # aggregation rules, the class/holder registrations, the dividend declaration + its CAS settlement
  # claim) that the write service orchestrates. Declared here — not renamed with a `_custom` suffix —
  # so the generator skips them wholesale; this declaration is what makes editing them legitimate.
  - "src/infrastructure/persistence/dividend_repository.rs"
  - "src/infrastructure/persistence/share_class_repository.rs"
  - "src/infrastructure/persistence/shareholder_repository.rs"
  - "src/infrastructure/persistence/share_transaction_repository.rs"
  - "src/presentation/http/guarded_routes.rs"
  # In-tree reference impl of the read contract (hand-authored alongside the generated
  # service aliases; gated behind `unstable-write-service`).
  - "src/application/service/equity_query_service_impl.rs"

  # Hand-authored migrations (the guarded company-artifact strip — the strip's ordering
  # guard is hand-authored logic, not schema-derived emission).
  - "migrations/20260909104947_strip_tenancy.up.sql"
  - "migrations/20260909104947_strip_tenancy.down.sql"

  # Behavior tests (the golden cases / oracle) + BDD features.
  - "tests/features/**"
  - "tests/equity_golden_cases.rs"
  - "tests/integrity_probes.rs"
  - "tests/equity_gl_seam.rs"
  - "tests/guarded_routes_probe.rs"
  - "tests/composition_proof.rs"
  - "tests/common/**"

  # Hand-authored module documentation.
  - "docs/**"